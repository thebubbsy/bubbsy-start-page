name: Auto-Update Threat Intelligence & CVE Catalog

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cves:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and Synchronize Latest CVEs
        run: |
          python update_cves.py

      - name: Commit and Push Updated Threat Intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar_cache.json data/radar_cache.js data/radar_metadata.json
          if git diff --staged --quiet; then
            echo "No new CVEs discovered. Catalog is already up to date."
          else
            git commit -m "chore(radar): auto-update threat intelligence & CVE catalog [skip ci]"
            git push
          fi
